<!doctype html>
<html lang="tr"><head><meta charset="utf-8">
<link rel="stylesheet" href="../assets/fonts.css">
<style>
  :root{--y:#FFFF00;--ink:#151412;--paper:#F4EFE3;--kraft:#C6A57A}
  *{margin:0;padding:0;box-sizing:border-box}
  body{width:1080px;height:1920px;background:var(--kraft);font-family:Montserrat,sans-serif;color:var(--ink);overflow:hidden;position:relative}
  .fiber{position:absolute;inset:0;background:
    radial-gradient(rgba(80,55,25,.18) 1px,transparent 1.6px) 0 0/9px 9px,
    radial-gradient(rgba(255,240,210,.18) 1px,transparent 1.8px) 4px 5px/13px 13px}
  .scrap{position:absolute;filter:drop-shadow(10px 12px 0 rgba(40,28,12,.35))}
  .scrap>div{width:100%;height:100%}
  .half{background:radial-gradient(rgba(21,20,18,.28) 30%,transparent 34%) 0 0/12px 12px,var(--paper)}
  .word{position:absolute;filter:drop-shadow(7px 8px 0 rgba(40,28,12,.35))}
  .word span{display:inline-block;padding:10px 26px 16px;line-height:1}
  .tape{position:absolute;background:rgba(244,239,227,.62);height:52px;width:170px;border-left:3px dashed rgba(21,20,18,.15);border-right:3px dashed rgba(21,20,18,.15)}
  .label{position:absolute;background:var(--ink);color:var(--paper);font-weight:600;font-size:26px;letter-spacing:.14em;padding:10px 18px;border-radius:4px}
  .tag{position:absolute;left:60px;bottom:50px;font-weight:600;font-size:22px;letter-spacing:.2em;color:var(--ink);opacity:.7}
</style></head><body>
<div class="fiber"></div>

<div class="word" style="left:70px;top:150px;transform:rotate(-4deg)"><span style="background:var(--paper);font-weight:400;font-size:96px">sen</span></div>
<div class="word" style="left:300px;top:250px;transform:rotate(3deg)"><span style="background:var(--y);font-weight:900;font-size:120px">KÖPRÜNÜN</span></div>
<div class="word" style="left:150px;top:420px;transform:rotate(-2deg)"><span style="background:var(--ink);color:var(--y);font-weight:800;font-size:134px;letter-spacing:-.03em">MİMARISIN</span></div>

<!-- left cliff: torn halftone photocopy -->
<div class="scrap" style="left:-30px;top:880px;width:470px;height:1100px"><div class="half" style="clip-path:polygon(0 0,82% 1%,88% 6%,84% 12%,92% 19%,87% 27%,95% 35%,90% 45%,97% 56%,92% 68%,99% 80%,94% 92%,100% 100%,0 100%)"></div></div>
<!-- right cliff: torn yellow -->
<div class="scrap" style="right:-30px;top:800px;width:470px;height:1200px"><div style="background:var(--y);width:100%;height:100%;clip-path:polygon(9% 0,100% 0,100% 100%,3% 100%,8% 90%,1% 78%,7% 66%,0 54%,6% 42%,2% 30%,8% 18%,3% 8%)"></div></div>

<div class="label" style="left:60px;top:960px;transform:rotate(-3deg)">MEVCUT DURUM</div>
<div style="position:absolute;left:70px;top:1040px;font-weight:800;font-size:46px;line-height:1.15;transform:rotate(-3deg)">acı<br>problem<br>eksik</div>
<div class="label" style="right:60px;top:880px;transform:rotate(2deg)">ARZULANAN DURUM</div>
<div style="position:absolute;right:80px;top:960px;font-weight:800;font-size:46px;line-height:1.15;text-align:right;transform:rotate(2deg)">kâr<br>verim<br>ciro</div>

<!-- the bridge: a strip of black tape with a dashed road line -->
<div class="scrap" style="left:330px;top:1290px;width:440px;height:96px;transform:rotate(-6deg)"><div style="background:var(--ink);clip-path:polygon(0 8%,4% 0,100% 6%,97% 100%,2% 94%);display:flex;align-items:center;justify-content:center"><div style="width:80%;height:8px;background:repeating-linear-gradient(90deg,var(--y) 0 40px,transparent 40px 70px)"></div></div></div>
<div class="tape" style="left:300px;top:1300px;transform:rotate(-40deg)"></div>
<div class="tape" style="left:690px;top:1240px;transform:rotate(30deg)"></div>

<div class="word" style="left:390px;top:1450px;transform:rotate(4deg)"><span style="background:var(--paper);font-weight:800;font-size:44px">köprü = ürün</span></div>
<div class="word" style="left:330px;top:1560px;transform:rotate(-3deg)"><span style="background:var(--y);font-weight:800;font-size:44px">geçiş ücreti = fiyat</span></div>
<div class="tag">029 · PAPER COLLAGE · KANIT ANI</div>
</body></html>
