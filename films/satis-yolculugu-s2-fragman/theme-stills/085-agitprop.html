<!doctype html>
<html lang="tr"><head><meta charset="utf-8">
<link rel="stylesheet" href="../assets/fonts.css">
<style>
  :root{--y:#FFFF00;--ink:#151412;--paper:#F4EFE3;--brick:#C8402A}
  *{margin:0;padding:0;box-sizing:border-box}
  body{width:1080px;height:1920px;background:var(--paper);font-family:Montserrat,sans-serif;color:var(--ink);overflow:hidden;position:relative}
  .grain{position:absolute;inset:0;background:radial-gradient(rgba(21,20,18,.07) 1px,transparent 1.4px) 0 0/7px 7px}
  .slogan{position:absolute;left:70px;top:170px;transform:rotate(-7deg);transform-origin:left top;font-weight:900;font-size:150px;line-height:.88;letter-spacing:-.04em}
  .slogan b{display:inline-block;background:var(--ink);color:var(--y);padding:4px 22px 14px;margin-top:10px}
  .bank-l{z-index:0;position:absolute;left:-40px;top:1000px;width:520px;height:1000px;background:var(--ink);clip-path:polygon(0 0,100% 18%,78% 100%,0 100%)}
  .circle{position:absolute;right:-120px;top:690px;width:620px;height:620px;border-radius:50%;background:var(--y);border:14px solid var(--ink)}
  .wedge{position:absolute;left:250px;top:930px;width:720px;height:250px;background:var(--y);clip-path:polygon(0 100%,100% 0,100% 40%);transform-origin:left bottom}
  .lbl{position:absolute;font-weight:800;font-size:44px;letter-spacing:-.01em;line-height:1}
  .lbl small{display:block;font-weight:600;font-size:28px;letter-spacing:.06em;margin-top:12px}
  .l1{left:40px;top:1290px;color:var(--y);transform:rotate(4deg)}
  .l1 small{color:var(--paper)}
  .l2{right:70px;top:880px;text-align:right;transform:rotate(-6deg)}
  .band{position:absolute;left:-80px;width:1300px;height:94px;display:flex;align-items:center;padding-left:140px;font-weight:800;font-size:34px;letter-spacing:.12em}
  .b1{top:1560px;background:var(--brick);color:var(--paper);transform:rotate(-8deg)}
  .b2{top:1680px;background:var(--y);color:var(--ink);transform:rotate(-8deg);border-top:8px solid var(--ink);border-bottom:8px solid var(--ink)}
  .shard{position:absolute;background:var(--ink)}
  .tag{position:absolute;left:60px;top:60px;font-weight:600;font-size:22px;letter-spacing:.2em;color:var(--ink);opacity:.7}
</style></head><body>
<div class="grain"></div>
<div class="slogan">SATIŞ<br>BİR<br><b>KÖPRÜDÜR.</b></div>
<div class="circle"></div>
<div class="bank-l"></div>
<div class="wedge"></div>
<div class="lbl l1">MEVCUT<br>DURUM<small>ACI · PROBLEM · EKSİK</small></div>
<div class="lbl l2">ARZULANAN<br>DURUM<small>KÂR · VERİM · CİRO</small></div>
<div class="shard" style="left:600px;top:780px;width:46px;height:14px;transform:rotate(-30deg)"></div>
<div class="shard" style="left:860px;top:1330px;width:26px;height:60px;transform:rotate(22deg)"></div>
<div class="shard" style="left:540px;top:1220px;width:60px;height:12px;transform:rotate(10deg);background:var(--brick)"></div>
<div class="band b1">ÜRÜN = KÖPRÜ &nbsp;·&nbsp; SEN = MİMAR</div>
<div class="band b2">FİYAT = GEÇİŞ ÜCRETİ ▶</div>
<div class="tag">085 · CONSTRUCTIVIST AGITPROP · KANIT ANI</div>
</body></html>
