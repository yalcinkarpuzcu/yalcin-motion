<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../assets/brand.css"><style>
*{margin:0;box-sizing:border-box}body{width:1080px;height:1920px;background:var(--bg);overflow:hidden;font-family:"DM Sans";color:var(--ink);position:relative}
.photo{position:absolute;inset:0;background:url(../assets/photos/sanliurfa-stage.png) center/cover;filter:blur(3px) saturate(.9) brightness(.55)}
.vig{position:absolute;inset:0;background:radial-gradient(ellipse 70% 55% at 50% 42%,transparent 0,#111014cc 70%,#111014 100%)}
.cone{position:absolute;left:190px;top:-80px;width:700px;height:1300px;background:linear-gradient(180deg,#C9FF5F33,#C9FF5F08 75%,transparent);clip-path:polygon(40% 0,60% 0,100% 100%,0 100%);filter:blur(18px)}
.pool{position:absolute;left:140px;top:1120px;width:800px;height:170px;border-radius:50%;background:radial-gradient(#C9FF5F40,transparent 70%);filter:blur(10px)}
.card{position:absolute;left:150px;top:610px;width:780px;padding:56px 60px;border-radius:36px;background:linear-gradient(160deg,#332941ee,#1b1822ee);box-shadow:0 0 0 2px #C9FF5F55,0 0 60px #C9FF5F44,0 40px 120px #000a;transform:rotate(-4deg)}
.k{font:700 26px "DM Sans";letter-spacing:.18em;color:var(--lav)}
.d{font:800 230px/0.9 Montserrat;color:var(--lime);margin:18px 0 6px;letter-spacing:-.03em}
.m{font:800 64px Montserrat;letter-spacing:.02em}
.p{font:500 34px "DM Sans";color:var(--mute);margin-top:24px}
.title{position:absolute;left:90px;top:200px;font:800 92px/1 Montserrat}
.logos{position:absolute;bottom:120px;left:0;right:0;display:flex;gap:56px;justify-content:center;align-items:center}.logos img{height:110px}
.lab{position:absolute;top:40px;left:40px;font:700 28px Montserrat;color:#C9FF5F;background:#111014;padding:10px 18px;border-radius:10px}
</style></head><body>
<div class="photo"></div><div class="vig"></div><div class="cone"></div><div class="pool"></div>
<div class="title">EURASIA<br>STARTUP<br>SUMMIT'26</div>
<div class="card"><div class="k">LET'S SCALE UP FİNAL ZİRVESİ</div><div class="d">24.10</div><div class="m">ÇORLU</div><div class="p">Çorlu Sanayi ve Ticaret Odası · 400 kişi</div></div>
<div class="logos"><img src="../assets/logos/jci-avrasya.png"><img src="../assets/logos/lets-scale-up.png"><img src="../assets/logos/ctso.png"></div>
<div class="lab">A · 061 DARK KEYNOTE</div>
</body></html>
