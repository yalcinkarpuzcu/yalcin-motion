<!doctype html>
<html lang="tr"><head><meta charset="utf-8">
<link rel="stylesheet" href="../assets/fonts/fonts.css">
<style>
:root{--y:#FFFF00;--ink:#151413;--cream:#F2ECDD;--rust:#D9452B}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1920px;height:1080px;overflow:hidden;background:var(--cream)}
.slogan{position:absolute;font:800 132px/0.9 Montserrat;letter-spacing:-.04em;color:var(--ink);transform-origin:left top}
.band{position:absolute;transform-origin:left center}
.mono{font:500 26px/1 "JetBrains Mono";letter-spacing:.08em}
.paper{position:absolute;inset:0;opacity:.07;background-image:radial-gradient(#000 0.6px,transparent 0.9px);background-size:4px 4px}
</style></head><body>
<svg width="1920" height="1080" style="position:absolute;inset:0">
  <!-- left circle = current state -->
  <circle cx="420" cy="640" r="250" fill="#151413"/>
  <!-- right circle = desired state -->
  <circle cx="1540" cy="520" r="250" fill="none" stroke="#151413" stroke-width="18"/>
  <!-- the wedge/bridge (yellow) piercing from left circle to right circle -->
  <path d="M300 700 L1620 470 L1660 560 Z" fill="#FFFF00" stroke="#151413" stroke-width="6"/>
  <!-- shards -->
  <rect x="1660" y="420" width="36" height="12" fill="#151413" transform="rotate(-20 1660 420)"/>
  <rect x="1700" y="520" width="44" height="12" fill="#D9452B" transform="rotate(14 1700 520)"/>
  <rect x="1640" y="610" width="30" height="10" fill="#151413" transform="rotate(32 1640 610)"/>
  <!-- toll: rust block -->
  <rect x="1050" y="430" width="90" height="90" fill="#D9452B" transform="rotate(-10 1050 430)"/>
  <text x="1092" y="500" text-anchor="middle" font-family="Montserrat" font-weight="900" font-size="58" fill="#F2ECDD" transform="rotate(-10 1092 480)">₺</text>
</svg>
<div class="band" style="left:-40px;top:930px;width:1100px;height:64px;background:var(--ink);transform:rotate(-6deg)"><div class="mono" style="color:var(--y);padding:19px 0 0 110px">MEVCUT DURUM → ARZULANAN DURUM</div></div>
<div class="slogan" style="left:110px;top:120px;transform:rotate(-6deg)">SATIŞ<br>BİR TAKAS</div>
<div class="slogan" style="left:1080px;top:740px;transform:rotate(-6deg);font-size:120px">DEĞİL<span style="color:var(--rust)">.</span></div>
<div style="position:absolute;left:300px;top:610px;font:800 40px/1 Montserrat;color:var(--y);letter-spacing:.02em">ACI</div>
<div style="position:absolute;left:1470px;top:500px;font:800 40px/1 Montserrat;color:var(--ink)">KÂR</div>
<div class="paper"></div>
</body></html>
