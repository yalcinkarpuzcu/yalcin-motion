(function () {

  cut("#c4-s23", 7.18, 17.59);

  // 25 · drill, crossed out, bores the hole (push-through)
  cut("#c4-s25", 17.59, 21.88);

  tl.fromTo("#c4-x", { scaleX: 0, rotation: -12 }, { scaleX: 1, rotation: -12, duration: 0.2, ease: "power3.in" }, 19.82);
  tl.fromTo("#c4-cr2", { opacity: 0 }, { opacity: 1, duration: 0.3 }, 19.82);

  tl.to(["#c4-t1", "#c4-t2", "#c4-t3"], { y: -60, duration: 0.8, ease: "power2.inOut" }, 27.99);
  pop("#c4-arac", 30.22, { x: -60 });

  // 28 · the title returns as the answer (surprise)

  tl.fromTo("#c4-ar1", { x: -300 }, { x: 0, duration: 0.4, ease: "power3.out" }, 35.79 - 0.3);

  tl.to("#c4-ar2", { y: 700, rotation: -20, duration: 0.6, ease: "power2.in" }, 36.78 + 0.08);

  tl.fromTo("#c4-cL", { y: 500 }, { y: 0, duration: 0.6, ease: "power2.out" }, 41.03);

  tl.to("#c4-coin", { x: 880, y: -60, scale: 0.4, duration: 0.3, ease: "power1.in" }, 73.67 - 0.3);
  tl.to("#c4-coin", { opacity: 0, duration: 0.05 }, 73.67);
