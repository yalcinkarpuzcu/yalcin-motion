  for (let x = 120; x < 1920; x += 110) p += '<path d="M' + x + " 0 C" + (x + 30) + " 360 " + (x - 30) + " 720 " + x + ' 1080"/>';
  for (let y = 80; y < 1080; y += 110) p += '<path d="M0 ' + y + " C640 " + (y + 30) + " 1280 " + (y - 30) + " 1920 " + y + '"/>';
  q("#c8-netg").innerHTML = p;

  PAPER.build(S);

  // 66 · ÖDEV stamp (surprise), phone, mail
  cut("#c8-s66", 0, {{w:Ürününden@452.6}});
  tl.fromTo("#c8-cr1", { opacity: 0 }, { opacity: 1, duration: 0.3 }, 0.1);
  tl.fromTo("#c8-odev", { scale: 2.6, opacity: 0, rotation: -20 }, { scale: 1, opacity: 1, rotation: -6, duration: 0.2, ease: "power4.in" }, {{w:ödev@446.3}} - 0.12);
  tl.fromTo(["#c8-phone", "#c8-pl"], { x: -500, opacity: 0 }, { x: 0, opacity: 1, duration: 0.4, ease: "power2.out" }, {{w:görüşmede@449.6}} - 0.2);
  tl.fromTo(["#c8-mail", "#c8-ml"], { x: 500, opacity: 0 }, { x: 0, opacity: 1, duration: 0.4, ease: "power2.out" }, {{w:mailde@451.4}} - 0.2);
  tl.fromTo("#c8-dene", { opacity: 0 }, { opacity: 1, duration: 0.3 }, {{w:dene@452.2}} - 0.2);

  // 67 · hard stop: one rule on ink (iris from the box)
  cut("#c8-s67", {{w:Ürününden@452.6}}, {{w:Sadece@454.4}});
  tl.fromTo("#c8-s67", { clipPath: "circle(0% at 50% 30%)" }, { clipPath: "circle(130% at 50% 30%)", duration: 0.35, ease: "expo.out" }, {{w:Ürününden@452.6}});

  const sl = qa(".c8-sl");

    pop(sl[i], t + 0.1, { y: i === 1 ? 30 : -30 });

  tl.fromTo("#c8-walker", { x: 0 }, { x: 600, duration: 1.2, ease: "power2.inOut" }, {{w:sorunundan@457.2}} - 0.8);

  tl.to("#c8-avci", { opacity: 0, duration: 0.01 }, {{w:değilsin@478.2}} + 1.0);
  tl.fromTo("#c8-avci2", { opacity: 0 }, { opacity: 0.55, duration: 0.2 }, {{w:değilsin@478.2}} + 0.55);
  tl.fromTo("#c8-avx", { scaleX: 0 }, { scaleX: 1, duration: 0.3, ease: "expo.out" }, {{w:değilsin@478.2}} + 0.7);
  tl.fromTo("#c8-msg", { opacity: 0, y: 40 }, { opacity: 1, y: 0, duration: 0.4, ease: "expo.out" }, {{w:sen@479.2}});
